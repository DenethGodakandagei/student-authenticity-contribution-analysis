<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INCODE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06070a;
      --card-bg: rgba(14, 20, 32, 0.55);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(22, 32, 50, 0.7);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --blue: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
    }

    body {
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse 100% 45% at 50% 0%, #0d1629 0%, #06070a 75%);
      background-attachment: fixed;
      font-size: 11px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand svg { width: 14px; height: 14px; color: var(--blue); }

    /* ── Status Badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 500;
      background: rgba(14, 20, 32, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-sub);
    }
    .status-tracking .status-dot,
    .status-synced .status-dot {
      background: var(--green);
    }
    .status-syncing .status-dot {
      background: var(--blue);
      animation: pulse 1s infinite alternate;
    }
    .status-error .status-dot {
      background: var(--red);
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ── Mode Switcher (Glass Card) ── */
    .mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 6px 9px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .mode-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-info svg {
      width: 13px;
      height: 13px;
      color: var(--blue);
    }
    .mode-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }
    .btn-mode-switch {
      background: rgba(22, 32, 50, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-mode-switch:hover {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .btn-mode-switch svg { width: 10px; height: 10px; }

    /* ── Metric Cards (Glass Effect) ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      border-color: rgba(56, 189, 248, 0.22);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.09);
    }
    .card-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 2px;
    }
    .card-val {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .val-green { color: var(--green); }
    .val-red { color: var(--red); }

    /* ── Detailed Metric Rows ── */
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 10.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .metric-row:last-child { border-bottom: none; }
    .metric-name { color: var(--text-muted); }
    .metric-val {
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* ── Provenance Bar ── */
    .prov-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(20, 28, 44, 0.7);
      display: flex;
      overflow: hidden;
      margin: 8px 0 6px 0;
    }
    .prov-seg-manual { background: var(--blue); transition: width 0.3s; }
    .prov-seg-ai { background: #818cf8; transition: width 0.3s; }
    .prov-seg-paste { background: #475569; transition: width 0.3s; }

    .prov-legend {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
    .prov-legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .dot-indicator { width: 6px; height: 6px; border-radius: 50%; }

    /* ── Buttons (Frosted Glass) ── */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      background: rgba(18, 25, 40, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover {
      background: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.28);
    }
    .btn-primary {
      grid-column: span 2;
      background: rgba(14, 116, 144, 0.16);
      border-color: rgba(56, 189, 248, 0.28);
      color: #7dd3fc;
      box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.15), 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .btn-primary:hover {
      background: rgba(14, 116, 144, 0.28);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .btn svg { width: 12px; height: 12px; }

    /* ── Section Titles ── */
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      font-weight: 600;
      margin: 10px 0 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── List Items (Frosted Glass) ── */
    .item-card {
      background: rgba(14, 20, 32, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 4px;
      font-size: 10.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .item-title {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, monospace;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 500;
      background: rgba(22, 32, 50, 0.6);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span>INCODE</span>
    </div>
    <div id="statusBadge" class="status-badge status-unconfigured">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ready</span>
    </div>
  </div>

  <!-- Operating Mode Switcher -->
  <div class="mode-bar">
    <div class="mode-info">
      <div id="modeIconSlot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <div id="modeTitle" class="mode-title">Real Mode</div>
      </div>
    </div>
    <button class="btn-mode-switch" onclick="postCmd('switchMode')" title="Switch operating mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 17H4M4 17l4-4M4 17l4 4M4 7h16M20 7l-4-4M20 7l-4 4"/>
      </svg>
      <span>Switch</span>
    </button>
  </div>

  <!-- Primary Stats Grid -->
  <div class="stats-grid">
    <div class="card">
      <div class="card-label">Time</div>
      <div class="card-val" id="statTime">0m</div>
    </div>
    <div class="card">
      <div class="card-label">Keystrokes</div>
      <div class="card-val" id="statKeys">0</div>
    </div>
    <div class="card">
      <div class="card-label">Added</div>
      <div class="card-val val-green" id="statAdded">+0</div>
    </div>
    <div class="card">
      <div class="card-label">Removed</div>
      <div class="card-val val-red" id="statRemoved">-0</div>
    </div>
  </div>

  <!-- Sensor Metrics -->
  <div class="card" style="margin-bottom: 8px;">
    <div class="metric-row">
      <span class="metric-name">Active / Idle</span>
      <span class="metric-val" id="statActiveIdleSplit">0m / 0m</span>
    </div>
    <div class="metric-row">
      <span class="metric-name">Typing Speed</span>
      <span class="metric-val" id="statTypingTime">0s</span>
    </div>
    <div class="metric-row">
      <span class="metric-name">Syntax Errors</span>
      <span class="metric-val" id="statSyntaxErrors">0 active</span>
    </div>
    <div class="metric-row">
      <span class="metric-name">Focus Shifts</span>
      <span class="metric-val" id="statFocusTransitions">0</span>
    </div>
    <div class="metric-row">
      <span class="metric-name">Queue Pending</span>
      <span class="metric-val" id="statQueuePending">0</span>
    </div>
  </div>

  <!-- Coding Provenance -->
  <div class="card" style="margin-bottom: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <span style="font-size: 10px; color: var(--text-muted);">Provenance</span>
      <span id="provStyleText" style="font-weight: 600; color: var(--blue); font-size: 10.5px;">Manual</span>
    </div>
    <div class="prov-bar">
      <div id="provBarManual" class="prov-seg-manual" style="width: 100%;"></div>
      <div id="provBarAi" class="prov-seg-ai" style="width: 0%;"></div>
      <div id="provBarPaste" class="prov-seg-paste" style="width: 0%;"></div>
    </div>
    <div class="prov-legend">
      <span class="prov-legend-item">
        <span class="dot-indicator" style="background: var(--blue);"></span>
        <span>Manual <strong id="provManPct" style="color: var(--text);">100%</strong></span>
      </span>
      <span class="prov-legend-item">
        <span class="dot-indicator" style="background: #818cf8;"></span>
        <span>AI <strong id="provAiPct" style="color: var(--text);">0%</strong></span>
      </span>
      <span class="prov-legend-item">
        <span class="dot-indicator" style="background: #475569;"></span>
        <span>Paste <strong id="provPastePct" style="color: var(--text);">0%</strong></span>
      </span>
    </div>
  </div>

  <!-- Actions -->
  <div class="btn-group">
    <button class="btn btn-primary" onclick="postCmd('syncNow')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
      </svg>
      <span>Sync Telemetry</span>
    </button>
    <button class="btn" onclick="postCmd('openDashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
        <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
      </svg>
      <span>Dashboard</span>
    </button>
    <button class="btn" onclick="postCmd('viewQueueAudit')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Queue Audit</span>
    </button>
  </div>

  <!-- Active Tracked Files -->
  <div class="section-title">
    <span>Tracked Files</span>
    <span id="filesCountBadge" style="color: var(--text-sub);">0</span>
  </div>
  <div id="fileActivitiesList">
    <div style="color: var(--text-sub); font-size: 10px; padding: 2px 0;">No modified files.</div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    function postCmd(command) { vscode.postMessage({ command }); }
    window.addEventListener('message', event => { if (event.data.type === 'updateState') render(event.data.state); });
    vscode.postMessage({ command: 'requestState' });

    function render(s) {
      if (!s) return;

      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      const st = s.statusState || 'tracking';
      badge.className = 'status-badge status-' + st;
      text.innerText = st === 'tracking' ? 'Active' : (st === 'syncing' ? 'Syncing' : 'Ready');

      document.getElementById('statTime').innerText = (s.durationMinutes || 0) + 'm';
      document.getElementById('statKeys').innerText = s.keystrokes || 0;
      document.getElementById('statAdded').innerText = '+' + (s.linesAdded || 0);
      document.getElementById('statRemoved').innerText = '-' + (s.linesRemoved || 0);

      // Mode Display
      const isExp = s.operatingMode === 'experimental';
      const mTitle = document.getElementById('modeTitle');
      const mSlot = document.getElementById('modeIconSlot');
      if (mTitle && mSlot) {
        if (isExp) {
          const pId = s.experimentSession ? s.experimentSession.participantId : 'Exp';
          const tCond = s.experimentSession && s.experimentSession.taskCondition === 'TASK_B_AI' ? 'Task B' : 'Task A';
          mTitle.innerText = `${pId} (${tCond})`;
          mSlot.innerHTML = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--blue)" stroke-width="2"><path d="M10 2v7.31M14 2v7.31M8.5 2h7M14 9.3l5.88 9.8A2 2 0 0 1 18.18 22H5.82a2 2 0 0 1-1.7-2.9L10 9.3"/></svg>`;
        } else {
          mTitle.innerText = 'Real Mode';
          mSlot.innerHTML = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--green)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
        }
      }

      const idleSec = s.idleSummary ? s.idleSummary.idleSeconds : 0;
      const activeSec = s.idleSummary ? s.idleSummary.activeCodingSeconds : ((s.durationMinutes || 0) * 60);
      document.getElementById('statActiveIdleSplit').innerText = Math.round(activeSec / 60) + 'm / ' + Math.round(idleSec / 60) + 'm';
      document.getElementById('statTypingTime').innerText = (s.idleSummary ? s.idleSummary.activeTypingSeconds : 0) + 's';
      const errCount = s.diagnosticSummary ? s.diagnosticSummary.currentErrorCount : 0;
      document.getElementById('statSyntaxErrors').innerText = errCount + ' active';
      document.getElementById('statFocusTransitions').innerText = (s.focusSummary ? s.focusSummary.focusTransitions : 0);
      document.getElementById('statQueuePending').innerText = (s.pendingEventCount !== undefined ? s.pendingEventCount : (s.queueStatus ? s.queueStatus.pendingCount : 0));

      if (s.provenance) {
        document.getElementById('provStyleText').innerText = s.provenance.style || 'Manual';
        document.getElementById('provBarManual').style.width = (s.provenance.manualPercent || 0) + '%';
        document.getElementById('provBarAi').style.width = (s.provenance.aiPercent || 0) + '%';
        document.getElementById('provBarPaste').style.width = (s.provenance.pastePercent || 0) + '%';
        document.getElementById('provManPct').innerText = (s.provenance.manualPercent || 0) + '%';
        document.getElementById('provAiPct').innerText = (s.provenance.aiPercent || 0) + '%';
        document.getElementById('provPastePct').innerText = (s.provenance.pastePercent || 0) + '%';
      }

      const filesListEl = document.getElementById('fileActivitiesList');
      const filesCountEl = document.getElementById('filesCountBadge');
      if (s.fileActivities && s.fileActivities.length > 0) {
        filesCountEl.innerText = s.fileActivities.length;
        filesListEl.innerHTML = s.fileActivities.slice(0, 5).map(fa => `
          <div class="item-card">
            <span class="item-title" title="${escapeHtml(fa.filePath)}">${escapeHtml(fa.filePath)}</span>
            <span class="badge">
              ${fa.typingProvenance === 'ai_assisted' ? 'AI' : (fa.typingProvenance === 'copy_paste' ? 'Paste' : (fa.typingProvenance === 'mixed' ? 'Mixed' : 'Manual'))}
            </span>
          </div>
        `).join('');
      } else {
        filesCountEl.innerText = '0';
        filesListEl.innerHTML = '<div style="color: var(--text-sub); font-size: 10px; padding: 2px 0;">No active files tracked.</div>';
      }
    }

    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  </script>
</body>
</html>
